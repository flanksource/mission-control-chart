{{- if not .Values.permissions.mcp }}
---
apiVersion: mission-control.flanksource.com/v1
kind: Role
metadata:
  name: mcp-user
spec:
  description: Use the MCP server
  rules:
    - name: use-mcp
      action: mcp:use
---
apiVersion: mission-control.flanksource.com/v1
kind: RoleBinding
metadata:
  name: all-people-mcp-users
spec:
  description: Grant all users to use MCP
  role: mcp-user
  subjects:
    people:
      - "*"
{{- end }}
