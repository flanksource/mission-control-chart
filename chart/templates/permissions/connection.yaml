{{- if not .Values.permissions.connections }}
---
apiVersion: mission-control.flanksource.com/v1
kind: Role
metadata:
  name: connection-user
spec:
  description: Read every connection and act with its credentials
  rules:
    - name: read-connections
      action: read
      resource:
        scopeRef: all-connections
    - name: use-connections
      action: connection:use
      resource:
        scopeRef: all-connections
---
apiVersion: mission-control.flanksource.com/v1
kind: RoleBinding
metadata:
  name: system-connection-users
spec:
  description: allow all mission control services access to read and use all the connections
  role: connection-user
  subjects:
    {{- include "incident-commander.rbac.systemSubjects" . | nindent 4 }}
---
apiVersion: mission-control.flanksource.com/v1
kind: RoleBinding
metadata:
  name: editor-connection-users
spec:
  description: allow editors to read and use all connections
  role: connection-user
  subjects:
    teams:
      - editors
{{- end }}
