{{- if not .Values.permissions.connections }}
---
apiVersion: mission-control.flanksource.com/v1
kind: Role
metadata:
  name: connection-user
spec:
  description: Read every connection and act with its credentials
  rules:
    - name: read-connections
      action: read
      resource:
        scopeRef: mission-control-builtin/all-connections
    - name: use-connections
      action: connection:use
      resource:
        scopeRef: mission-control-builtin/all-connections
---
apiVersion: mission-control.flanksource.com/v1
kind: RoleBinding
metadata:
  name: connection-users
spec:
  description: Allow everyone, and every resource acting on its own, to read and use all connections
  role: connection-user
  subjects:
    people:
      - "*"
    {{- include "incident-commander.rbac.resourceSubjects" . | nindent 4 }}
{{- end }}
