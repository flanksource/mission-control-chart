{{- if not .Values.permissions.playbooks }}
---
apiVersion: mission-control.flanksource.com/v1
kind: Role
metadata:
  name: playbook-runner
spec:
  description: Run, approve and cancel every playbook, without a target or on any config
  rules:
    {{- range $action := list "run" "approve" "cancel" }}
    - name: {{ $action }}-playbooks
      action: playbook:{{ $action }}
      resource:
        scopeRef: mission-control-builtin/all-playbooks
    - name: {{ $action }}-playbooks-on-configs
      action: playbook:{{ $action }}
      resource:
        scopeRef: mission-control-builtin/all-playbooks
      target:
        scopeRef: mission-control-builtin/all-configs
    {{- end }}
---
apiVersion: mission-control.flanksource.com/v1
kind: RoleBinding
metadata:
  name: playbook-runners
spec:
  description: Allow everyone, and every notification, to run playbooks
  role: playbook-runner
  subjects:
    people:
      - "*"
    notifications:
      - name: "*"
{{- end }}
