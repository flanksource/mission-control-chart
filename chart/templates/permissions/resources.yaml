{{- if not .Values.permissions.configs }}
---
apiVersion: mission-control.flanksource.com/v1
kind: Role
metadata:
  name: config-reader
spec:
  description: Read every config
  rules:
    - name: read-configs
      action: read
      resource:
        scopeRef: mission-control-builtin/all-configs
---
apiVersion: mission-control.flanksource.com/v1
kind: RoleBinding
metadata:
  name: resource-config-readers
spec:
  description: Allow every resource acting on its own to read all configs, e.g. a playbook running on a config
  role: config-reader
  subjects:
    {{- include "incident-commander.rbac.resourceSubjects" . | nindent 4 }}
{{- end }}
