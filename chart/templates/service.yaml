apiVersion: v1
kind: Service
metadata:
  name: {{ include "incident-commander.name" . }}
  labels:
    {{- include "incident-commander.labels" . | nindent 4 }}
    app.kubernetes.io/component: mission-control
spec:
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
    {{- if and (not .Values.upstream_push) (gt (int .Values.pluginHostGRPCPort) 0) }}
    - port: {{ .Values.pluginHostGRPCPort }}
      targetPort: {{ .Values.pluginHostGRPCPort }}
      protocol: TCP
      name: grpc
    {{- end }}
    {{- if gt (int .Values.metricsPort) 0 }}
    - port: {{ .Values.metricsPort }}
      targetPort: {{ .Values.metricsPort }}
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "incident-commander.missionControl.selectorLabels" . | nindent 4 }}
